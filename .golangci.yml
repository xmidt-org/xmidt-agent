---
version: "2"
linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - dupl
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - gosec
    - intrange
    - makezero
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    errorlint:
      errorf: true
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      min-len: 5
      min-occurrences: 5
      ignore-string-values: []
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        - ifElseChain
        - importShadow
        - commentedOutCode
        - unnamedResult
        - whyNoLint
        - sloppyReassign
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - funlen
          - goconst
          - prealloc
          - errcheck
          - forcetypeassert
          - exhaustive
          - gocritic
          - gosec
          - noctx
          - perfsprint
        path: _test.go
      - linters:
          - gosec
        path: internal/credentials/cmd/example/main.go
      - linters:
          - bodyclose
          - errorlint
          - gosec
          - govet
          - misspell
          - prealloc
          - staticcheck
        path: internal/nhooyr.io/*
    paths:
      - internal/jwtxt/keypairs_for_test.go
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/xmidt-org)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
